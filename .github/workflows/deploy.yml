name: Byg, test og udgiv

# Push til main => byg, test og udgiv automatisk til www.anemetteolesen.dk
# Pull requests => byg og test kun
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH_DIR: publish

jobs:
  byg-og-udgiv:
    runs-on: ubuntu-latest

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installér .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Anemette.slnx -c Release

      - name: Byg til Windows-serveren (self-contained)
        run: |
          dotnet publish src/Anemette.Web/Anemette.Web.csproj -c Release -r win-x64 --self-contained true -o "$PUBLISH_DIR"
          # Den gamle side havde "Web.config" med stort W. Samme navn, så FTP-synkroniseringen overskriver i stedet for at slette.
          mv "$PUBLISH_DIR/web.config" "$PUBLISH_DIR/Web.config"

      - name: Skriv hemmelige indstillinger
        if: github.event_name != 'pull_request'
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          KRYPTERING_NOEGLE: ${{ secrets.KRYPTERING_NOEGLE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          mangler = [n for n in ("DB_CONNECTION_STRING", "KRYPTERING_NOEGLE") if not os.environ.get(n)]
          if mangler:
              sys.exit("Secret mangler: " + ", ".join(mangler) + ". Se README.md.")
          indstillinger = {
              "ConnectionStrings": {"Database": os.environ["DB_CONNECTION_STRING"]},
              "Kryptering": {"Noegle": os.environ["KRYPTERING_NOEGLE"]},
              "Smtp": {"Bruger": os.environ.get("SMTP_USER", ""), "Kodeord": os.environ.get("SMTP_PASSWORD", "")},
          }
          with open(os.path.join(os.environ["PUBLISH_DIR"], "appsettings.Production.json"), "w", encoding="utf-8") as f:
              json.dump(indstillinger, f, ensure_ascii=False, indent=2)
          PY

      # IIS låser filerne, mens sitet kører. app_offline.htm stopper appen under upload.
      - name: Sæt siden på pause
        if: github.event_name != 'pull_request'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          printf '<!doctype html><meta charset="utf-8"><title>Opdateres</title><p style="font:20px Georgia,serif;margin:3em">Siden opdateres – prøv igen om et øjeblik.</p>' > app_offline.htm
          curl --fail --silent --show-error --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" -T app_offline.htm "ftp://$FTP_SERVER/anemetteolesen.dk/app_offline.htm"
          sleep 15

      - name: Upload via FTP
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./${{ env.PUBLISH_DIR }}/
          server-dir: /anemetteolesen.dk/
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/Uploads/**
            **/logs/**

      - name: Start siden igen
        if: always() && github.event_name != 'pull_request'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --silent --show-error --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" -Q "DELE /anemetteolesen.dk/app_offline.htm" "ftp://$FTP_SERVER/" || echo "app_offline.htm var allerede fjernet"
