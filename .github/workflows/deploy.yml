name: Build and deploy to webhotel

# Push til main => byg og udgiv automatisk til www.anemetteolesen.dk
# Pull requests => byg kun (tjekker at koden kompilerer), ingen udgivelse
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: Anemette.csproj
  PUBLISH_DIR: publish

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.PROJECT }} -PackagesDirectory packages

      - name: Build and publish (FileSystem)
        run: >
          msbuild ${{ env.PROJECT }}
          /p:Configuration=Release
          /p:Platform="AnyCPU"
          /p:DeployOnBuild=true
          /p:PublishProfile=FolderProfile
          /p:publishUrl=${{ github.workspace }}\${{ env.PUBLISH_DIR }}
          /p:DeleteExistingFiles=true

      - name: Write secret config files
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if (-not $env:DB_CONNECTION_STRING) {
            throw "Secret DB_CONNECTION_STRING mangler - sitet kan ikke køre uden database. Se README.md."
          }
          function Esc([string]$s) { [System.Security.SecurityElement]::Escape($s) }
          $cs = @"
          <?xml version="1.0" encoding="utf-8"?>
          <connectionStrings>
            <add name="DatabaseEntities" connectionString="$(Esc $env:DB_CONNECTION_STRING)" providerName="MySql.Data.MySqlClient" />
          </connectionStrings>
          "@
          Set-Content -Path "$env:PUBLISH_DIR/ConnectionStrings.config" -Value $cs.Trim() -Encoding utf8
          $secrets = @"
          <?xml version="1.0" encoding="utf-8"?>
          <appSettings>
            <add key="SmtpBruger" value="$(Esc $env:SMTP_USER)" />
            <add key="SmtpKodeord" value="$(Esc $env:SMTP_PASSWORD)" />
          </appSettings>
          "@
          Set-Content -Path "$env:PUBLISH_DIR/Secrets.config" -Value $secrets.Trim() -Encoding utf8

      # IIS låser DLL'erne i bin/ mens sitet kører. app_offline.htm får IIS til at stoppe appen under upload.
      - name: Take site offline
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          Set-Content app_offline.htm '<!doctype html><meta charset="utf-8"><title>Opdateres</title><p>Siden opdateres - prøv igen om et øjeblik.</p>' -Encoding utf8
          curl.exe --fail --silent --show-error --ssl-reqd --user "${env:FTP_USERNAME}:${env:FTP_PASSWORD}" -T app_offline.htm "ftp://$($env:FTP_SERVER)/anemetteolesen.dk/app_offline.htm"
          if ($LASTEXITCODE -ne 0) { throw "Kunne ikke uploade app_offline.htm" }
          Start-Sleep -Seconds 15

      - name: Deploy over FTP
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./${{ env.PUBLISH_DIR }}/
          server-dir: /anemetteolesen.dk/
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/Uploads/**

      - name: Bring site online
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl.exe --fail --silent --show-error --ssl-reqd --user "${env:FTP_USERNAME}:${env:FTP_PASSWORD}" -Q "DELE /anemetteolesen.dk/app_offline.htm" "ftp://$($env:FTP_SERVER)/"
